# ── Old Railway hostname → custom domain ───────────────────────
# One canonical host, so search engines don't index two copies of the site.
# Exact-match server_name beats the default server below; every other Host
# (custom domain, localhost) still falls through to it.
server {
    listen 80;
    server_name ralphy-production.up.railway.app;
    return 301 https://ralphalcaide.com$request_uri;
}

server {
    listen 80 default_server;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at Railway's edge, so nginx only ever sees http. Absolute
    # redirects would send visitors to http://<host>/...; relative ones keep
    # whatever scheme and host the browser is already on.
    absolute_redirect off;

    # ── Legacy trip URLs → the photo feed ──────────────────────────
    # These have to be real 301s, not React <Navigate>. The sitemap has been
    # publishing /trips/{tripId}/posts/{id} since v1, so those URLs are
    # indexed; a client-side rewrite reads as a soft redirect and loses the
    # link equity. App.jsx keeps matching <Navigate> routes for in-app
    # navigation, which never reaches nginx.
    #
    # /trips/:id has no 1:1 successor — a trip is not a post — so it lands on
    # the feed rather than 404ing.
    location ~ ^/trips/[0-9]+/posts/([0-9]+)/?$ { return 301 /posts/$1; }
    location ~ ^/trips/[0-9]+/?$               { return 301 /posts; }
    location = /trips                          { return 301 /posts; }
    location = /trips/                         { return 301 /posts; }

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin sitemap, generated by the API.
    # Deliberately the *.up.railway.app host, not api.ralphalcaide.com: nginx
    # resolves proxy_pass hosts at startup and refuses to boot if one doesn't
    # resolve, so this must not depend on the custom domain's DNS.
    location = /sitemap.xml {
        proxy_pass https://ralph-portfolio-production.up.railway.app/api/sitemap.xml;
        proxy_ssl_server_name on;
        proxy_set_header Host ralph-portfolio-production.up.railway.app;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml
               application/xml+rss text/javascript;
}