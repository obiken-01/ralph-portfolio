server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Legacy trip URLs → the photo feed ──────────────────────────
    # These have to be real 301s, not React <Navigate>. The sitemap has been
    # publishing /trips/{tripId}/posts/{id} since v1, so those URLs are
    # indexed; a client-side rewrite reads as a soft redirect and loses the
    # link equity. App.jsx keeps matching <Navigate> routes for in-app
    # navigation, which never reaches nginx.
    #
    # /trips/:id has no 1:1 successor — a trip is not a post — so it lands on
    # the feed rather than 404ing.
    location ~ ^/trips/[0-9]+/posts/([0-9]+)/?$ { return 301 /posts/$1; }
    location ~ ^/trips/[0-9]+/?$               { return 301 /posts; }
    location = /trips                          { return 301 /posts; }
    location = /trips/                         { return 301 /posts; }

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin sitemap, generated by the API
    location = /sitemap.xml {
        proxy_pass https://ralph-portfolio-production.up.railway.app/api/sitemap.xml;
        proxy_ssl_server_name on;
        proxy_set_header Host ralph-portfolio-production.up.railway.app;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json
               application/javascript text/xml application/xml
               application/xml+rss text/javascript;
}