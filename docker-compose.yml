services:
  api:
    build:
      context: ./Ralphy
      dockerfile: Ralphy.Api/Dockerfile
    image: ralphy-api
    container_name: ralphy-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=${DB_CONNECTION_STRING}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
      - Seq__ServerUrl=http://seq:5341
    depends_on:
      db:
        condition: service_healthy
      seq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ralphy-network

  web:
    build:
      context: ./Ralphy/Ralphy.Web
      dockerfile: Dockerfile
    image: ralphy-web
    container_name: ralphy-web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ralphy-network

  db:
    image: postgres:16
    container_name: ralphy-db
    environment:
      POSTGRES_DB: ralphy_db
      POSTGRES_USER: ralphy_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ralphy_user -d ralphy_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ralphy-network

  seq:
    image: datalust/seq:latest
    container_name: ralphy-seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: true
    ports:
      - "5441:80"
      - "5442:5341"
    volumes:
      - seqdata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ralphy-network

volumes:
  pgdata:
  seqdata:

networks:
  ralphy-network:
    driver: bridge